<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--ground:#f6f7f9;--ink:#16181d;--ink-2:#3d424b;--muted:#8b919b;--accent:#4f46e5;--write:#b45309;--border:#e3e6ea}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1920px;height:1080px;background:var(--ground);font-family:'IBM Plex Sans',system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
  .mark{width:104px;height:104px;border-radius:26px;background:var(--ink);color:#fff;
        display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:600;letter-spacing:-.02em}
  h1{margin-top:44px;font-size:76px;font-weight:600;color:var(--ink);letter-spacing:-.025em}
  .sub{margin-top:14px;font-size:28px;color:var(--muted)}
  .links{margin-top:64px;display:flex;flex-direction:column;align-items:center;gap:18px;
         font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:34px}
  .links .live{color:var(--accent);font-weight:600}
  .links .repo{color:var(--ink-2)}
  .rule{margin-top:64px;width:520px;height:1px;background:var(--border)}
  .foot{margin-top:38px;font-size:24px;color:var(--muted);display:flex;align-items:center;gap:18px}
</style></head><body>
  <div class="mark">S</div>
  <h1>Sundae Metrics</h1>
  <div class="sub">Six WebMCP tools on a sales dashboard</div>
  <div class="links">
    <span class="live">sundae-metrics.vercel.app</span>
    <span class="repo">github.com/gmassello/sundae-metrics</span>
  </div>
  <div class="rule"></div>
  <div class="foot">MIT &nbsp;·&nbsp; The WebMCP Challenge</div>
</body></html>
